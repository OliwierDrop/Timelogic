# Tryb C — HTTPS wbudowany (własne PEM w ./certs).
# Wymaga: certs/fullchain.pem, certs/privkey.pem
# docker compose -f compose.yaml -f scripts/compose.tls.yml up -d

services:
  web:
    ports: !override
      - "443:443"
      - "80:80"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./apps/web/nginx.tls.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 10
